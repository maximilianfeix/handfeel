name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Check package contents
        run: node scripts/check-pack.mjs
      - name: Pack smoke test
        shell: bash
        run: |
          npm pack
          mkdir -p /tmp/smoke && cd /tmp/smoke
          npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE"/handfeel-*.tgz
          npx handfeel --version
          npx handfeel scan "$GITHUB_WORKSPACE/evals/apps/expo-budget/before" --summary
          npx handfeel scan --demo --summary
          npx handfeel rules > /dev/null
          # a folder without app source must not get a score
          mkdir -p /tmp/empty && set +e && npx handfeel scan /tmp/empty; code=$?; set -e
          test "$code" = 2

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate marketplace manifest
        run: |
          node -e "const m=require('./.claude-plugin/marketplace.json'); if(!m.plugins?.length) process.exit(1); console.log('marketplace ok', m.plugins[0].name)"
          test -f skills/handfeel/SKILL.md
          head -5 skills/handfeel/SKILL.md | grep -q '^name: handfeel$'
