name: Compose eval build

# Builds the generated Jetpack Compose app (before and after handfeel fix) and
# screenshots it on an Android emulator. The maintainer's machine can't run the emulator.
on:
  push:
    branches: [main]
    paths: ['evals/apps/compose-*/**', '.github/workflows/compose.yml']
  pull_request:
    paths: ['evals/apps/compose-*/**', '.github/workflows/compose.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [before]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build debug APK
        run: |
          set -o pipefail
          gradle -p evals/apps/compose-tasks/${{ matrix.variant }} :app:assembleDebug --no-daemon 2>&1 | tee $RUNNER_TEMP/build.log | grep -E "^e: |^w: |BUILD (SUCCESSFUL|FAILED)|warning:" | head -80
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Screenshots on an emulator (light and dark)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            mkdir -p shots
            adb install -r evals/apps/compose-tasks/${{ matrix.variant }}/app/build/outputs/apk/debug/app-debug.apk
            adb shell cmd uimode night no; adb shell am start -n com.daylight.tasks/.MainActivity; sleep 8; adb exec-out screencap -p > shots/compose-tasks-${{ matrix.variant }}-light.png
            adb shell am force-stop com.daylight.tasks; adb shell cmd uimode night yes; adb shell am start -n com.daylight.tasks/.MainActivity; sleep 8; adb exec-out screencap -p > shots/compose-tasks-${{ matrix.variant }}-dark.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-tasks-${{ matrix.variant }}
          path: |
            shots/
            ${{ runner.temp }}/build.log
